[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-med"
version = "0.1.0"
description = "Repair malformed LLM JSON output — strips fences, fixes trailing commas, closes truncated structures, validates against Pydantic models."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "KikiDev", email = "yanakiewkr@gmail.com" }]
keywords = ["llm", "json", "repair", "pydantic", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/Yanflare/json-med"
Repository = "https://github.com/Yanflare/json-med"
Issues = "https://github.com/Yanflare/json-med/issues"
Changelog = "https://github.com/Yanflare/json-med/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/json_med"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=json_med --cov-report=term-missing"

[tool.coverage.run]
source = ["src/json_med"]
